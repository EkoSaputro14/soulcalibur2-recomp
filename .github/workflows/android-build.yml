# SPDX-License-Identifier: GPL-3.0-or-later
# Android verification & release APK workflow:
# 1) Runs repository audit + native C++17 Defend (G) touch state machine unit/regression tests.
# 2) Sets up JDK 17 + Android SDK 34 + Android NDK 27.2.12479018, builds SDL3 + shaderc + launcher for arm64-v8a,
#    and verifies NDK C++17 compilation of runtime/sc2_touch.cpp and runtime/sc2_android.cpp.
# 3) When secrets.XBE_URL (or workflow_dispatch input xbe_url) is provided with the user's own Default.xbe,
#    lifts private/program and runs tools/release/android.sh to produce & publish Soulcalibur2Recomp-android.apk.
name: Android Build & Verify

on:
  push:
    branches: [main, 'fix/*']
    tags: ['android-*']
  workflow_dispatch:
    inputs:
      xbe_url:
        description: 'Optional URL to your own Xbox Soulcalibur II Default.xbe (overrides secrets.XBE_URL)'
        required: false
        type: string
      guests_url:
        description: 'Optional URL to guests-root.olk'
        required: false
        type: string
      publish_release:
        description: 'Publish/update GitHub Release when full APK is built'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      SDL_VERSION: '3.4.16'
      SDL_SHA256: '7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68'
      NDK_VERSION: '27.2.12479018'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize shared runtime submodule
        run: git submodule update --init --depth 1 third_party/doa2u-re

      - name: Audit repository
        run: tools/audit.sh

      - name: Run C++17 Defend (G) touch state machine tests
        run: |
          mkdir -p build
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Iruntime runtime/sc2_touch_test.cpp -o build/sc2_touch_test
          ./build/sc2_touch_test

      - name: Set up JDK 17 and Ninja
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ninja-build and cmake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ninja-build cmake unzip perl

      - name: Set up Android SDK 34 and NDK 27.2.12479018
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build SDL3, shaderc, launcher, and NDK-compile sc2_touch.cpp + sc2_android.cpp
        run: |
          deps="$PWD/build/deps"
          mkdir -p "$deps"
          sdl="$deps/SDL3-${SDL_VERSION}"
          if [ ! -d "$sdl/src" ]; then
            curl -fsSL -o "$sdl.tar.gz" "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
            echo "${SDL_SHA256}  $sdl.tar.gz" | shasum -a 256 -c -
            tar -xzf "$sdl.tar.gz" -C "$deps"
          fi
          ANDROID_FLAGS="-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static -Wno-deprecated"
          cmake -S "$sdl" -B "$deps/sdl-android-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF \
            -DCMAKE_INSTALL_PREFIX="$deps/sdl-android" $ANDROID_FLAGS
          cmake --build "$deps/sdl-android-build" --target install

          "$ANDROID_NDK_HOME/ndk-build" -C tools/release/android-shaderc \
            NDK_PROJECT_PATH=. NDK_OUT="$PWD/build/android-shaderc/obj" \
            NDK_LIBS_OUT="$PWD/build/android-shaderc/libs" -j"$(nproc)"

          export SC2_LAUNCHER_DIR=build/android-launcher
          export SC2_CMAKE_ARGS="$ANDROID_FLAGS -DSDL3_DIR=$deps/sdl-android/lib/cmake/SDL3"
          python3 tools/build_game.py launcher

          curl -fsSL -o "$deps/imgui.tar.gz" https://github.com/ocornut/imgui/archive/refs/tags/v1.91.9.tar.gz
          tar -xzf "$deps/imgui.tar.gz" -C "$deps"
          CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          "$CXX" -std=c++17 -fPIC -O2 -Wall -Wextra -Werror \
            -I. -Iruntime -Ithird_party/doa2u-re/recomp-runtime \
            -I"$deps/imgui-1.91.9" -I"$deps/sdl-android/include" \
            -c runtime/sc2_touch.cpp -o build/sc2_touch.arm64.o
          "$CXX" -std=c++17 -fPIC -O2 -Wall -Wextra -Werror \
            -I. -Iruntime -Ithird_party/doa2u-re/recomp-runtime \
            -I"$deps/sdl-android/include" \
            -c runtime/sc2_android.cpp -o build/sc2_android.arm64.o
          mkdir -p "$PWD/build/staged-check/jniLibs/arm64-v8a" "$PWD/build/staged-check/assets"
          (cd android && ./gradlew --console=plain -q -PstagedDir="$PWD/../build/staged-check" -PsdlDir="$sdl" compileReleaseJavaWithJavac)
          ls -lh build/android-launcher/libsoulcalibur2-launcher.so \
                 build/android-shaderc/libs/arm64-v8a/libshaderc_shared.so \
                 build/deps/sdl-android/lib/libSDL3.so \
                 build/sc2_touch.arm64.o build/sc2_android.arm64.o

      - name: Build full Release APK (if XBE_URL is provided)
        id: apk
        env:
          XBE_URL_INPUT: ${{ inputs.xbe_url }}
          XBE_URL_SECRET: ${{ secrets.XBE_URL }}
          GUESTS_URL_INPUT: ${{ inputs.guests_url }}
          GUESTS_URL_SECRET: ${{ secrets.GUESTS_URL }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          XBE_URL="${XBE_URL_INPUT:-$XBE_URL_SECRET}"
          if [ -z "$XBE_URL" ]; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Android NDK & Defend (G) Verification Passed"
              echo "- \`runtime/sc2_touch_test.cpp\`: **PASSED** (10/10 Defend & touch state machine tests)"
              echo "- Android NDK \`arm64-v8a\` compiled \`sc2_touch.cpp\`, \`sc2_android.cpp\`, \`libSDL3.so\`, \`libshaderc_shared.so\`, \`libsoulcalibur2-launcher.so\` cleanly."
              echo "- **Full APK skipped**: \`XBE_URL\` secret/input is not configured (\`tools/build_game.py build\` requires your own Xbox \`Default.xbe\` to lift \`libsoulcalibur2.so\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git submodule update --init --depth 1 tools/xboxrecomp
          mkdir -p private/disc private/program/none private/logs
          curl -fsSL -o private/disc/Default.xbe "$XBE_URL"
          python3 -m venv private/venv
          private/venv/bin/pip install -q capstone==5.0.7
          private/venv/bin/python tools/build_game.py lift

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
            export KEYSTORE=/tmp/release.keystore
          fi
          tools/release/android.sh
          (cd build && sha256sum Soulcalibur2Recomp-android.apk > SHA256SUMS.txt)
          echo "built=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Full Android Release APK Built"
            echo "- \`build/Soulcalibur2Recomp-android.apk\` ($(du -h build/Soulcalibur2Recomp-android.apk | cut -f1))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified NDK artifacts (when full APK was not built)
        if: steps.apk.outputs.built != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-verified-components
          path: |
            build/sc2_touch_test
            build/sc2_touch.arm64.o
            build/sc2_android.arm64.o
            build/android-launcher/libsoulcalibur2-launcher.so
            build/android-shaderc/libs/arm64-v8a/libshaderc_shared.so
            build/deps/sdl-android/lib/libSDL3.so

      - name: Upload Release APK artifact
        if: steps.apk.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Soulcalibur2Recomp-android-apk
          path: |
            build/Soulcalibur2Recomp-android.apk
            build/SHA256SUMS.txt

      - name: Publish GitHub Release (when full APK is built)
        if: steps.apk.outputs.built == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-android-fix', '0.4.0-beta.1') }}
          name: Soulcalibur II Recomp Android (Defend Fix)
          prerelease: true
          files: |
            build/Soulcalibur2Recomp-android.apk
            build/SHA256SUMS.txt
